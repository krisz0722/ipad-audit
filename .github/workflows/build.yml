name: Build reader

# A kiolvasó program egyetlen fájlba csomagolva, hogy az eladónak ne kelljen Pythont telepítenie.
# Kézzel indítva (workflow_dispatch) csak építi és tesztel. v* taggel release-t is készít SHA256 fájlokkal.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, os: ubuntu-24.04 }
          - { name: windows-x86_64, os: windows-2022 }
          - { name: macos-arm64, os: macos-15 }
          - { name: macos-x86_64, os: macos-15-intel }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install -r requirements.txt pyinstaller pytest

      - name: Test
        run: python -m pytest tests/test_core.py tests/test_reader.py tests/test_audit.py -q

      - name: Build single file
        run: >
          python -m PyInstaller --noconfirm --onefile --noupx --name ipad-audit-reader
          --paths tool --collect-all pymobiledevice3 --add-data "web:web" tool/ipad_audit/reader.py

      - name: Build folder variant (Windows, fewer antivirus false positives)
        if: startsWith(matrix.name, 'windows')
        run: >
          python -m PyInstaller --noconfirm --onedir --noupx --name ipad-audit-reader-folder
          --paths tool --collect-all pymobiledevice3 --add-data "web:web" tool/ipad_audit/reader.py

      - name: Package
        run: |
          mkdir -p out
          case "${{ matrix.name }}" in
            windows-*)
              cp dist/ipad-audit-reader.exe "out/ipad-audit-reader-${{ matrix.name }}.exe"
              python -c "import shutil; shutil.make_archive('out/ipad-audit-reader-${{ matrix.name }}-folder', 'zip', 'dist/ipad-audit-reader-folder')"
              ;;
            *)
              tar -czf "out/ipad-audit-reader-${{ matrix.name }}.tar.gz" -C dist ipad-audit-reader
              ;;
          esac
          python - <<'EOF'
          import hashlib, pathlib
          for p in sorted(pathlib.Path('out').iterdir()):
              if p.suffix != '.sha256':
                  digest = hashlib.sha256(p.read_bytes()).hexdigest()
                  pathlib.Path(str(p) + '.sha256').write_text(digest + '  ' + p.name + '\n')
          EOF
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: reader-${{ matrix.name }}
          path: out/*
          if-no-files-found: error

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          pattern: reader-*
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" out/*
          --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME"
          --notes "Built by GitHub Actions from the public source of this repository. Verify the downloaded file with the matching .sha256 file."
