name: test

# Minden push és pull request után lefutnak a Node és a Python tesztek.
# A main branchre pusholva, zöld tesztek után a web/ mappa GitHub Pagesre kerül.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --include=dev --ignore-scripts --no-package-lock
      - run: npm test

  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m pytest -q
        env:
          PYTHONPATH: tool

  pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [unit, python]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Build site
        run: |
          mkdir -p public
          cp -r web/* public/
          COMMIT_SHORT=$(echo "$GITHUB_SHA" | cut -c1-8)
          COMMIT_DATE=$(date -u +"%Y.%m.%d.")
          COMMIT_TIME=$(date -u +"%H:%M UTC")
          printf '{\n  "commit": "%s",\n  "date": "%s",\n  "time": "%s"\n}\n' "$COMMIT_SHORT" "$COMMIT_DATE" "$COMMIT_TIME" > public/version.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deploy
        uses: actions/deploy-pages@v4
