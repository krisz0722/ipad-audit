stages:
  - test
  - deploy

# Minden push és merge request után lefutnak az egységtesztek. A deploy csak zöld teszt után indul.
test:
  stage: test
  image: node:22-alpine
  script:
    - npm install --include=dev --ignore-scripts --no-package-lock
    - npm test
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

pages:
  stage: deploy
  image: alpine:3.20
  script:
    - mkdir -p public
    - cp -r web/* public/
    - COMMIT_SHORT=$(echo "$CI_COMMIT_SHA" | cut -c1-8)
    - COMMIT_DATE=$(date -u +"%Y.%m.%d.")
    - COMMIT_TIME=$(date -u +"%H:%M UTC")
    - 'printf "{\n  \"commit\": \"%s\",\n  \"date\": \"%s\",\n  \"time\": \"%s\"\n}\n" "$COMMIT_SHORT" "$COMMIT_DATE" "$COMMIT_TIME" > public/version.json'
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
