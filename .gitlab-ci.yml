stages:
  - test
  - deploy

# Minden push és merge request után lefutnak az egységtesztek. A deploy csak zöld teszt után indul.
test:
  stage: test
  image: node:22-alpine
  script:
    - npm test
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

pages:
  stage: deploy
  image: alpine:3.20
  script:
    - mkdir -p public
    - cp -r web/* public/
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
