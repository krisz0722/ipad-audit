<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>iPad teszt</title>
<style>
  :root { --bg:#f5f5f4; --card:#fff; --text:#1c1917; --muted:#57534e; --accent:#1d4ed8; --ok:#15803d; --bad:#b91c1c; --line:#d6d3d1; }
  * { box-sizing:border-box; -webkit-user-select:none; user-select:none; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--text); font:18px/1.45 -apple-system,system-ui,sans-serif; }
  main { max-width:640px; margin:0 auto; padding:24px 16px 40px; }
  h1 { font-size:26px; margin:0 0 10px; }
  p { margin:0 0 14px; }
  .muted { color:var(--muted); font-size:16px; }
  .progress { color:var(--muted); font-size:15px; margin-bottom:8px; }
  button { font:inherit; font-weight:600; padding:14px 20px; border:0; border-radius:10px; background:var(--accent); color:#fff; margin:6px 8px 6px 0; }
  button.ghost { background:transparent; color:var(--accent); border:1px solid var(--line); }
  video { width:100%; border-radius:10px; background:#000; display:block; margin-bottom:12px; }
  .status { font-weight:600; min-height:28px; }
  .wait::before { content:'⏳ '; }
  .ok { color:var(--ok); } .bad { color:var(--bad); }
  ul.checks { list-style:none; padding:0; margin:0 0 14px; }
  #grid { position:fixed; inset:0; display:grid; background:#fff; touch-action:none; z-index:5; }
  #grid div { border:1px solid #e7e5e4; }
  #grid div.on { background:#22c55e; }
  #gridnote { position:fixed; left:0; right:0; top:40%; text-align:center; z-index:6; pointer-events:none; font-weight:600; }
  #color { position:fixed; inset:0; z-index:5; }
  #colorbar { position:fixed; left:0; right:0; bottom:18px; text-align:center; z-index:6; }
</style>
</head>
<body>
<main id="app"></main>
<script src="config.js"></script>
<script src="vendor/jsQR.js"></script>
<script src="app.js"></script>
</body>
</html>
